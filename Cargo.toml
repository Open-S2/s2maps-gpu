[package]
name = "s2maps-gpu"
version = "0.1.0"
rust-version = "1.91.0"
edition = "2024"
authors = ["Craig O'Connor <oconnorct1@gmail.com>"]
description = "S2 Maps GPU - An open source, high-performance, and GPU-accelerated map engine for rendering large-scale, interactive maps."
documentation = "https://docs.rs/s2maps-gpu"
homepage = "https://github.com/Open-S2/s2maps-gpu"
repository = "https://github.com/Open-S2/s2maps-gpu"
readme = "README.md"
categories = [
  "no-std",
  "algorithms",
  "computer-vision",
  "embedded",
  "graphics",
  "rendering",
  "wasm",
]
keywords = ["tools", "s2", "gis", "maps", "cartography", "gpu", "webgpu", "digital", "mapping"]
# license = "SEE LICENSE"
license-file = "LICENSE"
include = ["rust/**", "/Cargo.toml", "/katex-header.html", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]

[lib]
name = "s2maps_gpu"
path = "rust/lib.rs"

# [[bin]]
# name = "s2maps-gpu"
# path = "rust/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Open S2 dependencies
earclip = "1"
open-vector-tile = "1"
pbf = "1.22"
s2json = "1"
s2-tilejson = "1"
gis-tools = { version = "1", default-features = false, features = ["quadratic"] }
# External shared dependencies
libm = "0.2" # NOTE: Rust Core is working on a replacement for libm
half = "2.7" # NOTE: Rust Core is working on a replacement for half
regex = { version = "1", default-features = false } # Managed by the Rust Project
futures = { version = "0.3", default-features = false } # Managed by the Rust Project
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
# Rendering dependencies
winit = "0.30"
wgpu = { version = "30", default-features = false, features = [
  "serde",
  "wgsl",
  "vulkan",
  "gles",
  "dx12",
  "metal",
  "static-dxc",
] }
bytemuck = { version = "1.22", features = ["extern_crate_alloc", "min_const_generics"] }
# Optional std dependencies
image = { version = "0.25", optional = true, default-features = false }
# Optional std/wasm fetch dependency
surf = { version = "2", default-features = false }
# Optional Embassy dependencies
embassy-time = { version = "0.5", optional = true }
embassy-net = { version = "0.9", optional = true, default-features = false }
embassy-sync = { version = "0.8", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tiny_http = "0.12"
smol = "2"
# We need the float_roundtrip feature for serde_json to match javascript float results
serde_json = { version = "1.0", default-features = false, features = ["alloc", "float_roundtrip"] }

[features]
default = ["webgpu", "std"] # Default feature
nightly = [] # Nightly system for improving coverage accuracy reporting
# Rendering based features
webgl = ["wgpu/webgl"]
webgpu = ["wgpu/webgpu"]
# Conditional std feature enabling quadratic or other projection features
std = [
  "image",
  "image/rayon",
  "image/default-formats",
  "surf/h1-client",
  "gis-tools/std",
  "embassy-sync",
  "embassy-sync/std",
  "futures/std",
]
# Conditional wasm feature for browser tools like fetching
wasm = ["surf/wasm-client"]
# Conditional Embassy features
embassy = ["embassy-time", "embassy-net", "embassy-sync", "image", "image/png", "image/jpeg"]

[profile.bench]
inherits = "release"
opt-level = 3
# un-comment these when using flamegraph.
# debug = true
# [profile.release]
# debug = true

[profile.dev.package]
image.opt-level = 3
adler2.opt-level = 3
crc32fast.opt-level = 3
miniz_oxide.opt-level = 3
png.opt-level = 3
fdeflate.opt-level = 3
flate2.opt-level = 3
